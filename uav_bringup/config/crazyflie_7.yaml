# Simulation clock — required so nodes with use_sim_time=true get real
# simulated dt instead of wall-clock time.
- topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Wind disturbance — unknown to the controller, applied as physical force in Gazebo
- topic_name: "/wind/velocity"
  ros_type_name: "geometry_msgs/msg/Vector3"
  gz_type_name: "gz.msgs.Vector3d"
  lazy: true
  direction: ROS_TO_GZ

- topic_name: "/wind/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  lazy: true
  direction: ROS_TO_GZ

