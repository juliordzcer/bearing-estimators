# Wind disturbance
- topic_name: "/wind/velocity"
  ros_type_name: "geometry_msgs/msg/Vector3"
  gz_type_name: "gz.msgs.Vector3d"
  lazy: false
  direction: ROS_TO_GZ

- topic_name: "/wind/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  lazy: false
  direction: ROS_TO_GZ

# Robot 1
# Velocity command configuration.
- topic_name: "/crazyflie1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  lazy: false
  direction: ROS_TO_GZ

